name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Keep in step with GOLANGCI_LINT_VERSION in scripts/check.sh.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      # The same gate as local: gofmt, names, vet, lint, tests (including the
      # goldens on the committed fixture), generated files, build.
      - run: scripts/check.sh
        env:
          REQUIRE_TAILWIND: "1"
