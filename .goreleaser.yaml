# Release builds of the assessgap command (GoReleaser v2).
#
#   go run github.com/goreleaser/goreleaser/v2@v2.20.3 check
#   go run github.com/goreleaser/goreleaser/v2@v2.20.3 release --snapshot --clean   # local test, into dist/
#
# Releases are made by the release workflow (.github/workflows-pending/release.yml
# until a maintainer installs it) when a maintainer pushes a v* tag. Pure Go (SQLite via modernc.org/sqlite), so no cgo and no C toolchain.
version: 2

project_name: assessgap

before:
  hooks:
    - go mod download

builds:
  - id: assessgap
    main: ./cmd/assessgap
    binary: assessgap
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/assessgap/assessgap/internal/cli.version={{ .Version }}
      - -X github.com/assessgap/assessgap/internal/cli.commit={{ .ShortCommit }}
      - -X github.com/assessgap/assessgap/internal/cli.date={{ .CommitDate }}
    # The commit date, not the build time, so the same tag builds the same binary.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: assessgap
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  draft: true
  footer: |
    AssessGap compares assessed values only. It is not an appraisal and not legal advice. AssessGap never files an appeal for anyone.
